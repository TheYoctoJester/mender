name: Windows build + installer

on:
  push:
    branches: [windows-port]
  pull_request:
    branches: [windows-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Real vcpkg binary cache: the "files" provider writes compiled packages into
  # a directory we persist with actions/cache. On a cache hit the boost/openssl/
  # libarchive builds (~18 min) are skipped.
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg_cache,readwrite"

jobs:
  build:
    name: Build mender-update.exe and NSIS installer
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout (with submodules + tags)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      # restore/save are split (rather than actions/cache@v4) so the expensive
      # vcpkg output is saved even when a later step fails - otherwise a failing
      # iteration streak never populates the cache.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Ensure vcpkg cache dir exists
        run: New-Item -ItemType Directory -Force -Path vcpkg_cache | Out-Null

      - name: Compute version
        id: version
        run: |
          # Mirror the version logic in src/CMakeLists.txt exactly, so the
          # installer filename matches what the binary reports via --version.
          $v = git describe --tags --dirty --exact-match 2>$null
          if (-not $v) { $v = git rev-parse --short HEAD }
          $v = "$v".Trim() -replace '[^A-Za-z0-9._-]', '-'
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Configure (CMake + vcpkg, MSVC x64)
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=OFF

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build
        run: cmake --build build --config Release --target mender-update --parallel

      - name: Install NSSM (bundled into the installer)
        id: nssm
        run: |
          # NSSM is often already on the runner image, in which case choco exits
          # non-zero ("0/1 installed"); that is fine, we only need the binary.
          choco install nssm -y --no-progress | Out-Host
          # Bundle the real win64 binary, not choco's PATH shim.
          $nssm = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Recurse -Filter nssm.exe -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\win64\\' } | Select-Object -First 1
          if (-not $nssm) {
            $nssm = Get-ChildItem "C:\ProgramData\chocolatey\lib" -Recurse -Filter nssm.exe -ErrorAction SilentlyContinue |
                    Select-Object -First 1
          }
          if (-not $nssm) { throw "nssm.exe not found after choco install" }
          Write-Host "NSSM: $($nssm.FullName)"
          "nssm_exe=$($nssm.FullName)" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Stage installer payload
        run: |
          ./support/windows/installer/Stage-Payload.ps1 `
            -NssmExe "${{ steps.nssm.outputs.nssm_exe }}" `
            -OutDir "$PWD/payload"

      - name: Build NSIS installer
        id: installer
        run: |
          choco install nsis -y --no-progress
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          $out = Join-Path $PWD "mender-setup-${{ steps.version.outputs.version }}.exe"
          & $makensis "/DVERSION=${{ steps.version.outputs.version }}" `
                      "/DPAYLOAD=$PWD\payload" `
                      "/DOUTFILE=$out" `
                      support\windows\installer\mender-setup.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
          if (-not (Test-Path $out)) { throw "installer not produced at $out" }
          Write-Host "Installer: $out"
          "installer=$out" >> $env:GITHUB_OUTPUT

      - name: Smoke test
        run: |
          $ErrorActionPreference = "Stop"

          # Run a process with a hard timeout so a hung installer can't wedge the job.
          function Invoke-Bounded([string]$File, [string[]]$Args, [int]$TimeoutSec) {
            $p = Start-Process -FilePath $File -ArgumentList $Args -PassThru
            if (-not $p.WaitForExit($TimeoutSec * 1000)) {
              try { $p.Kill() } catch {}
              throw "$File did not exit within $TimeoutSec s"
            }
            return $p.ExitCode
          }

          $expected = "${{ steps.version.outputs.version }}"

          # 1. The freshly built exe must launch AND report the expected version.
          $out = (& payload\program\mender-update.exe --version 2>&1 | Out-String).Trim()
          $code = $LASTEXITCODE
          Write-Host "mender-update --version -> exit $code : $out"
          if ($code -ne 0) { throw "mender-update --version exited $code (expected 0)" }
          if ($out -notmatch [regex]::Escape($expected)) {
            throw "version output '$out' does not contain expected version '$expected'"
          }

          # 2. Silent install must place the binary AND leave a Running service.
          $installer = "${{ steps.installer.outputs.installer }}"
          if (-not (Test-Path $installer)) { throw "installer not found: $installer" }
          Write-Host "Silent install: $installer /S"
          $rc = Invoke-Bounded $installer @("/S") 180
          Write-Host "installer exit: $rc"

          $installed = "$env:ProgramFiles\Mender\mender-update.exe"
          if (-not (Test-Path $installed)) { throw "installer did not place $installed" }
          Write-Host "Installed binary present: $installed"

          Start-Sleep -Seconds 5
          $svc = Get-Service MenderClient -ErrorAction SilentlyContinue
          if (-not $svc) { throw "MenderClient service was not registered" }
          if ($svc.Status -ne 'Running') {
            $log = "$env:ProgramData\Mender\logs\mender-service.log"
            if (Test-Path $log) { Write-Host "--- service log ---"; Get-Content $log -Tail 30 }
            throw "MenderClient service is '$($svc.Status)', expected 'Running'"
          }
          Write-Host "Service registered and running: $($svc.Name)"

          # 3. Uninstall must remove the service and the binary.
          $uninst = "$env:ProgramFiles\Mender\Uninstall.exe"
          if (Test-Path $uninst) {
            $urc = Invoke-Bounded $uninst @("/S") 180
            Write-Host "uninstaller exit: $urc"
            Start-Sleep -Seconds 3
            if (Get-Service MenderClient -ErrorAction SilentlyContinue) {
              Write-Warning "MenderClient service still present after uninstall"
            }
          }

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mender-windows-installer-${{ steps.version.outputs.version }}
          path: |
            mender-setup-*.exe
            payload/program/mender-update.exe
          if-no-files-found: warn

  # Honest test signal. Non-blocking (the Windows port is experimental), but it
  # actually builds and runs the portable unit tests covering the recent
  # changes - StringToLongLong (MSVC fix) and the HTTP Retry-After parser.
  #
  # update_module_test is intentionally NOT included: it is written against
  # POSIX (mkdir(path,mode), chmod, S_IRUSR, mkfifo) and does not compile on
  # MSVC. Porting it to Windows is tracked separately.
  test:
    name: Unit tests (non-blocking)
    runs-on: windows-2022
    timeout-minutes: 90
    continue-on-error: true
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout (with submodules + tags)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Ensure vcpkg cache dir exists
        run: New-Item -ItemType Directory -Force -Path vcpkg_cache | Out-Null

      - name: Configure (tests enabled)
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=ON

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build + run portable unit tests
        run: |
          $ErrorActionPreference = "Continue"
          $failed = $false

          # vcpkg builds dynamic libs; the test exes need the vcpkg DLLs on PATH.
          $env:PATH = "$PWD\build\vcpkg_installed\x64-windows\bin;$env:PATH"

          $targets = @("common_test", "http_date_test")
          foreach ($t in $targets) {
            Write-Host "::group::build $t"
            cmake --build build --config Release --target $t
            if ($LASTEXITCODE -ne 0) { Write-Warning "build of $t failed ($LASTEXITCODE)"; $failed = $true }
            Write-Host "::endgroup::"
          }

          # Run the gtest executables directly rather than via ctest: gtest's
          # build-time test discovery is unreliable on Windows, and the exe's
          # own exit code already reflects pass/fail.
          foreach ($t in $targets) {
            $exe = Get-ChildItem build -Recurse -Filter "$t.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) { Write-Warning "$t.exe not found (build failed?)"; $failed = $true; continue }
            Write-Host "::group::run $t"
            & $exe.FullName
            if ($LASTEXITCODE -ne 0) { Write-Warning "$t reported test failures ($LASTEXITCODE)"; $failed = $true }
            Write-Host "::endgroup::"
          }

          if ($failed) { exit 1 }
